services:
  backend:
    image: ${AWS_ECR_REGISTRY}/aidtrack-backend:${IMAGE_TAG:-latest}
    container_name: aidtrack-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: ${AWS_ECR_REGISTRY}/aidtrack-frontend:${IMAGE_TAG:-latest}
    container_name: aidtrack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    user: "root"
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data_prod:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  grafana_data_prod:
