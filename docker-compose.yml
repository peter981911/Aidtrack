services:
  backend:
    build:
      context: ./aidtrack-backend
      dockerfile: Dockerfile
    container_name: aidtrack-backend
    ports:
      - "5000:5000"
    env_file:
      - ./aidtrack-backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./aidtrack_frontend
      dockerfile: Dockerfile
    container_name: aidtrack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    user: "root"
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data_recovery:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  grafana_data_recovery:
    external: true
    name: 857069e991aa95b3088033668495637708816df2a4846005ba2322fbbeafd58e
