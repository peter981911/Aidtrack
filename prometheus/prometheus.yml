global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:5000']

  - job_name: 'docker_containers'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
