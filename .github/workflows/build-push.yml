name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud

      # --- 1. SONARCLOUD SAST SCAN ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/build/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # --- 2. TRIVY & BUILD: BACKEND ---
      - name: Build backend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack-backend
          load: true
          tags: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/aidtrack-backend:${{ github.sha }}

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.AZURE_ACR_LOGIN_SERVER }}/aidtrack-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        env:
          ACR_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
        run: docker push $ACR_SERVER/aidtrack-backend:${{ github.sha }}

      # --- 3. TRIVY & BUILD: FRONTEND ---
      - name: Build frontend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack_frontend 
          load: true
          tags: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}/aidtrack-frontend:${{ github.sha }}

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.AZURE_ACR_LOGIN_SERVER }}/aidtrack-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        env:
          ACR_SERVER: ${{ secrets.AZURE_ACR_LOGIN_SERVER }}
        run: docker push $ACR_SERVER/aidtrack-frontend:${{ github.sha }}
