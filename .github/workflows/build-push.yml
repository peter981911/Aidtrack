name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud

      # --- 1. SONARCLOUD SAST SCAN ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/build/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      # --- 2. TRIVY & BUILD: BACKEND ---
      - name: Build backend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack-backend
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/aidtrack-backend:${{ github.sha }}

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/aidtrack-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/aidtrack-backend:${{ github.sha }}

      # --- 3. TRIVY & BUILD: FRONTEND ---
      - name: Build frontend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack_frontend 
          load: true
          tags: ${{ steps.login-ecr.outputs.registry }}/aidtrack-frontend:${{ github.sha }}

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/aidtrack-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker push $ECR_REGISTRY/aidtrack-frontend:${{ github.sha }}

  deploy:
    needs: security-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose and config files to EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,prometheus/prometheus.yml"
          target: "/home/ubuntu/aidtrack"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.AWS_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            # Ensure AWS CLI is installed on the EC2 instance
            if ! command -v aws &> /dev/null; then
              echo "AWS CLI not found. Installing..."
              sudo apt-get update && sudo apt-get install -y unzip
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip -q awscliv2.zip
              sudo ./aws/install
              rm -rf aws awscliv2.zip
            fi
            
            mkdir -p /home/ubuntu/aidtrack
            cd /home/ubuntu/aidtrack
            
            # Fetch secrets from AWS Systems Manager Parameter Store
            # Assuming EC2 instance has an IAM Role attached with SSM permissions
            export AWS_DEFAULT_REGION=ap-south-1
            export MONGO_URI=$(aws ssm get-parameter --name "/aidtrack/MONGO_URI" --with-decryption --query "Parameter.Value" --output text)
            export JWT_SECRET=$(aws ssm get-parameter --name "/aidtrack/JWT_SECRET" --with-decryption --query "Parameter.Value" --output text)
            
            # Write them to a strict, temporary .env file for Docker
            echo "MONGO_URI=$MONGO_URI" > .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            chmod 600 .env
            
            # Authenticate Docker to ECR using the attached IAM Role
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com
            
            # Export Registry Variable for Docker Compose
            export AWS_ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com"
            export IMAGE_TAG=${{ github.sha }}
            
            # Pull exactly the images we just built
            docker pull $AWS_ECR_REGISTRY/aidtrack-backend:$IMAGE_TAG
            docker pull $AWS_ECR_REGISTRY/aidtrack-frontend:$IMAGE_TAG
            
            # Spin up the containers
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
