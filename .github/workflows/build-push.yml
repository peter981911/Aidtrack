name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud

      # --- 1. SONARCLOUD SAST SCAN ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/build/**

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 2. TRIVY & BUILD: BACKEND ---
      - name: Build backend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack-backend
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aidtrack-backend:latest

      - name: Trivy Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aidtrack-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aidtrack-backend:latest

      # --- 3. TRIVY & BUILD: FRONTEND ---
      - name: Build frontend (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: ./aidtrack_frontend 
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aidtrack-frontend:latest

      - name: Trivy Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/aidtrack-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aidtrack-frontend:latest
